app-id: io.mango3d.LycheeSlicer
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: lycheeslicer
tags:
  - proprietary
finish-args:
  - --share=ipc
  - --socket=x11
  - --share=network
  - --device=dri
  - --filesystem=home
modules:
  - name: squashfs-tools
    buildsystem: simple
    build-commands:
      - XZ_SUPPORT=1 LZO_SUPPORT=1 ZSTD_SUPPORT=1 GZIP_SUPPORT=1 make -C squashfs-tools -j ${FLATPAK_BUILDER_N_JOBS} install INSTALL_DIR=${FLATPAK_DEST}/bin INSTALL_MANPAGES_DIR=${FLATPAK_DEST}/man/man1
    cleanup:
      - /man
    sources:
      - type: git
        url: https://github.com/plougher/squashfs-tools.git
        tag: 4.7.5
        commit: 708c59ae80853b0845017c33b42e56061cc546cd

  - name: lycheeslicer
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -D ${FLATPAK_ID}.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -D ${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm755 lycheeslicer /app/bin/lycheeslicer
      - install -Dm755 apply_extra /app/bin/apply_extra
    sources:
      - type: extra-data
        url: https://mango-lychee.nyc3.cdn.digitaloceanspaces.com/LycheeSlicer-8.0.4-linux-x86_64.GLIBC-235.AppImage
        filename: lychee.AppImage
        sha256: 9d606d5728c1daddbf6efa472a2216049081325cd7297efdd51cacef82f9eb20
        size: 296159736
      - type: file
        path: io.mango3d.LycheeSlicer.metainfo.xml
      - type: file
        path: io.mango3d.LycheeSlicer.desktop
      - type: file
        path: io.mango3d.LycheeSlicer.png
      - type: script
        dest-filename: lycheeslicer
        commands:
          - zypak-wrapper /app/extra/LycheeSlicer/LycheeSlicer "$@"
      - type: script
        dest-filename: apply_extra
        commands:
          - |
            chmod +x lychee.AppImage
            offset=""
            for candidate in $(grep -aob -- 'hsqs' lychee.AppImage | cut -d: -f1); do
              if unsquashfs -s -o "$candidate" lychee.AppImage >/dev/null 2>&1; then
                offset="$candidate"
              fi
            done
            test -n "$offset"
            unsquashfs -o "$offset" -d squashfs-root lychee.AppImage
            mv squashfs-root/opt/Lychee LycheeSlicer
            rm -rf squashfs-root lychee.AppImage
